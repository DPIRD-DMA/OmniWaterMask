<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
  <title id="title">OmniWaterMask</title>
  <desc id="desc">Text-only OmniWaterMask wordmark with water-blue emphasis.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b8ff"/>
      <stop offset="0.48" stop-color="#0677df"/>
      <stop offset="1" stop-color="#034ea2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2233"/>
      <stop offset="0.55" stop-color="#16283a"/>
      <stop offset="1" stop-color="#071523"/>
    </linearGradient>
    <filter id="soft-shadow" x="-4%" y="-20%" width="108%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b2336" flood-opacity="0.14"/>
    </filter>
  </defs>

  <text x="50%" y="132"
    text-anchor="middle"
    font-family="Inter, Avenir Next, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="108"
    font-weight="800"
    letter-spacing="0"
    stroke="#ffffff"
    stroke-width="10"
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#soft-shadow)">
    <tspan fill="url(#sheen)">Omni</tspan><tspan fill="url(#water)">Water</tspan><tspan fill="url(#sheen)">Mask</tspan>
  </text>
</svg>
