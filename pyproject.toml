[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omniwatermask"
authors = [{name = "Nick Wright", email = "nicholas.wright@dpird.wa.gov.au"}]
dynamic = ["version"]
description = "Python library for water segmentation in high to moderate resolution remotely sensed imagery"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<2.4", # upper bound needed until numba supports numpy 2.4+
    "omnicloudmask>=1.7.1",
    "opencv-python>=4.9.0.80",
    "geopandas>=1.0",
    "osmnx>=2.0.0",
    "scipy>=1.10.0",
    "pyarrow>=10.0.0",
    "huggingface_hub>=0.28.1",
    "safetensors>=0.3.0",
    "gdown>=5.1.0",
    "rasterio>=1.3",
    "timm>=0.9",
    "torch>=2.3.0",
    "tqdm>=4.0",
    "platformdirs>=4.0.0",
    "fastai>=2.7",
]
license = "MIT"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["sentinel-2", "landsat", "maxar", "planetscope", "satellite", "water", "remote-sensing", "mask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[tool.setuptools_scm]
version_file = "omniwatermask/_version.py"

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "jupyter>=1.1.1",
    "mypy>=1.19",
    "nbmake>=1.5.5",
    "pre-commit>=4.0",
    "pytest>=9.0.2",
    "ruff>=0.12.2",
    "s2mosaic>=0.3.2",
]

[project.urls]
Homepage = "https://github.com/DPIRD-DMA/OmniWaterMask"
Repository = "https://github.com/DPIRD-DMA/OmniWaterMask"
Issues = "https://github.com/DPIRD-DMA/OmniWaterMask/issues"
Changelog = "https://github.com/DPIRD-DMA/OmniWaterMask/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["omniwatermask"]

[tool.setuptools.package-data]
omniwatermask = ["model_download_links.csv", "py.typed"]

[tool.mypy]
files = ["omniwatermask"]
ignore_missing_imports = true
strict = true

[tool.ruff]
extend-exclude = ["omniwatermask/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"*.ipynb" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests (require model downloads and real data processing)",
]
addopts = "-m 'not e2e'"
filterwarnings = [
    "ignore::DeprecationWarning",
]
